<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#0d2820"/>
      <stop offset="100%" stop-color="#040e0b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#5de0d8"/>
      <stop offset="60%" stop-color="#2ab8b0"/>
      <stop offset="100%" stop-color="#1a8880"/>
    </radialGradient>
    <clipPath id="shield">
      <path d="M256,44 C224,44 112,74 112,210 C112,336 162,416 256,468 C350,416 400,336 400,210 C400,74 288,44 256,44 Z"/>
    </clipPath>
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" fill="#061614"/>

  <!-- Shield filled with teal gradient + outer glow -->
  <path d="M256,44 C224,44 112,74 112,210 C112,336 162,416 256,468 C350,416 400,336 400,210 C400,74 288,44 256,44 Z"
        fill="url(#glow)" filter="url(#outerGlow)"/>

  <!-- All dark separator gaps, clipped to shield -->
  <g clip-path="url(#shield)" fill="#061614">

    <!-- TOP ARCH: two vertical dividers creating 3 panels -->
    <rect x="200" y="44"  width="13" height="145"/>
    <rect x="299" y="44"  width="13" height="145"/>
    <!-- Horizontal gap below top arch -->
    <rect x="112" y="186" width="288" height="13"/>

    <!-- EYE SECTION: diagonals converging from outer-top to inner-bottom -->
    <!-- Left eye right edge: diagonal strip from (200,199) down to (249,330) -->
    <polygon points="200,199 213,199 262,330 249,330"/>
    <!-- Right eye left edge: mirror -->
    <polygon points="299,199 312,199 263,330 250,330"/>
    <!-- Nose bridge between eyes -->
    <rect x="250" y="199" width="12" height="131"/>
    <!-- Horizontal gap below eye section -->
    <rect x="112" y="330" width="288" height="13"/>

    <!-- LOWER COLUMNS: two vertical dividers creating 3 columns -->
    <rect x="200" y="343" width="13" height="135"/>
    <rect x="299" y="343" width="13" height="135"/>

    <!-- Inner arch carved into centre column -->
    <!-- Outer dark arch (the gap around the inner teal arch) -->
    <path d="M213,478 L213,408 Q256,352 299,408 L299,478 Z"/>
    <!-- Inner teal arch re-added as lighter (we punch a smaller arch back out below) -->

  </g>

  <!-- Re-punch teal inner arch inside centre column gap (smaller arch) -->
  <path d="M222,478 L222,414 Q256,370 290,414 L290,478 Z"
        fill="url(#glow)" clip-path="url(#shield)"/>
  <!-- Vertical spine inside inner arch -->
  <rect x="250" y="390" width="12" height="88"
        fill="#061614" clip-path="url(#shield)"/>

</svg>