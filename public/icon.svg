<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#1e1e10"/>
      <stop offset="100%" stop-color="#0a0a06"/>
    </radialGradient>
  </defs>

  <!-- Shield background -->
  <path d="M256,16 C148,16 44,76 28,186 C12,300 76,408 256,496 C436,408 500,300 484,186 C468,76 364,16 256,16 Z"
        fill="url(#bg)" stroke="#c9a84c" stroke-width="10"/>

  <!-- Crown: upward chevron at top -->
  <polyline points="192,138 256,80 320,138"
            fill="none" stroke="#c9a84c" stroke-width="11" stroke-linejoin="miter"/>

  <!-- Brow bar -->
  <line x1="156" y1="154" x2="356" y2="154" stroke="#c9a84c" stroke-width="10"/>

  <!-- Left eye: hexagon -->
  <polygon points="164,186 196,170 228,186 228,220 196,236 164,220"
           fill="none" stroke="#c9a84c" stroke-width="9"/>
  <!-- Left eye inner dot -->
  <circle cx="196" cy="203" r="12" fill="#c9a84c"/>

  <!-- Right eye: hexagon -->
  <polygon points="284,186 316,170 348,186 348,220 316,236 284,220"
           fill="none" stroke="#c9a84c" stroke-width="9"/>
  <!-- Right eye inner dot -->
  <circle cx="316" cy="203" r="12" fill="#c9a84c"/>

  <!-- Nose bridge: vertical centre line from brow to mid bar -->
  <line x1="256" y1="154" x2="256" y2="268" stroke="#c9a84c" stroke-width="9"/>

  <!-- Mid / cheek bar -->
  <line x1="156" y1="268" x2="356" y2="268" stroke="#c9a84c" stroke-width="10"/>

  <!-- Cheek diagonals -->
  <line x1="156" y1="268" x2="192" y2="328" stroke="#c9a84c" stroke-width="9"/>
  <line x1="356" y1="268" x2="320" y2="328" stroke="#c9a84c" stroke-width="9"/>

  <!-- Jaw bar -->
  <line x1="192" y1="328" x2="320" y2="328" stroke="#c9a84c" stroke-width="10"/>

  <!-- Three lower columns -->
  <line x1="210" y1="328" x2="210" y2="418" stroke="#c9a84c" stroke-width="9"/>
  <line x1="256" y1="328" x2="256" y2="418" stroke="#c9a84c" stroke-width="9"/>
  <line x1="302" y1="328" x2="302" y2="418" stroke="#c9a84c" stroke-width="9"/>

  <!-- Base bar -->
  <line x1="192" y1="418" x2="320" y2="418" stroke="#c9a84c" stroke-width="10"/>
</svg>
