<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#0d2820"/>
      <stop offset="100%" stop-color="#040e0b"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield background -->
  <path d="M256,32 L378,62 L390,180 L390,252 Q388,358 340,410 Q298,452 256,468 Q214,452 172,410 Q124,358 122,252 L122,180 L134,62 Z"
        fill="url(#bg)" stroke="#2ec8c0" stroke-width="9" filter="url(#glow)"/>

  <!-- === TOP PANEL (forehead) === -->
  <!-- Outer horizontal bars -->
  <rect x="152" y="92"  width="208" height="10" fill="#2ec8c0" filter="url(#glow)"/>
  <rect x="152" y="142" width="208" height="8"  fill="#2ec8c0" filter="url(#glow)"/>
  <!-- Three vertical dividers -->
  <rect x="152" y="92" width="8"  height="58" fill="#2ec8c0" filter="url(#glow)"/>
  <rect x="248" y="92" width="8"  height="58" fill="#2ec8c0" filter="url(#glow)"/>
  <rect x="308" y="92" width="8"  height="58" fill="#2ec8c0" filter="url(#glow)"/>
  <rect x="352" y="92" width="8"  height="58" fill="#2ec8c0" filter="url(#glow)"/>
  <!-- Inner horizontal mid-bar -->
  <rect x="160" y="116" width="200" height="6" fill="#2ec8c0" filter="url(#glow)"/>

  <!-- === EYE SECTION === -->
  <!-- Left eye outer box -->
  <rect x="148" y="158" width="96" height="98" fill="none" stroke="#2ec8c0" stroke-width="8" filter="url(#glow)"/>
  <!-- Left eye horizontal divider -->
  <rect x="148" y="203" width="96" height="7" fill="#2ec8c0" filter="url(#glow)"/>
  <!-- Left eye inner glow fill -->
  <rect x="156" y="166" width="80" height="29" fill="#1a7a76" opacity="0.5"/>
  <rect x="156" y="210" width="80" height="38" fill="#1a7a76" opacity="0.3"/>

  <!-- Right eye outer box -->
  <rect x="268" y="158" width="96" height="98" fill="none" stroke="#2ec8c0" stroke-width="8" filter="url(#glow)"/>
  <!-- Right eye horizontal divider -->
  <rect x="268" y="203" width="96" height="7" fill="#2ec8c0" filter="url(#glow)"/>
  <!-- Right eye inner glow fill -->
  <rect x="276" y="166" width="80" height="29" fill="#1a7a76" opacity="0.5"/>
  <rect x="276" y="210" width="80" height="38" fill="#1a7a76" opacity="0.3"/>

  <!-- Nose bridge between eyes -->
  <rect x="248" y="166" width="16" height="82" fill="#2ec8c0" filter="url(#glow)"/>

  <!-- === MID FACE PANEL === -->
  <rect x="148" y="264" width="216" height="8"  fill="#2ec8c0" filter="url(#glow)"/>
  <rect x="148" y="264" width="8"   height="62" fill="#2ec8c0" filter="url(#glow)"/>
  <rect x="356" y="264" width="8"   height="62" fill="#2ec8c0" filter="url(#glow)"/>
  <rect x="248" y="272" width="16"  height="54" fill="#2ec8c0" filter="url(#glow)"/>
  <rect x="148" y="318" width="216" height="8"  fill="#2ec8c0" filter="url(#glow)"/>

  <!-- === LOWER COLUMNS === -->
  <rect x="148" y="334" width="216" height="8" fill="#2ec8c0" filter="url(#glow)"/>
  <!-- Three columns -->
  <rect x="156" y="342" width="52" height="84" fill="none" stroke="#2ec8c0" stroke-width="7" filter="url(#glow)"/>
  <rect x="230" y="342" width="52" height="84" fill="none" stroke="#2ec8c0" stroke-width="7" filter="url(#glow)"/>
  <rect x="304" y="342" width="52" height="84" fill="none" stroke="#2ec8c0" stroke-width="7" filter="url(#glow)"/>
  <!-- Bottom bar -->
  <rect x="148" y="418" width="216" height="8" fill="#2ec8c0" filter="url(#glow)"/>
</svg>
